<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' downtoread-asset:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DownToRead</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
<main id="document" class="markdown-body" aria-live="polite"><p class="empty">Open a Markdown document to begin.</p></main>
<nav id="history-hover-zone" class="history-hover-zone" aria-label="Document history">
  <div class="history-controls">
    <button id="history-back" type="button" aria-label="Back" title="Back" disabled><span aria-hidden="true">←</span></button>
    <button id="history-home" type="button" aria-label="Start page" title="Start page" disabled><span aria-hidden="true">○</span></button>
    <button id="history-forward" type="button" aria-label="Forward" title="Forward" disabled><span aria-hidden="true">→</span></button>
  </div>
</nav>
<script src="vendor/marked.umd.js"></script><script src="vendor/purify.min.js"></script><script src="vendor/mermaid.min.js"></script><script src="renderer.js"></script>
</body></html>
