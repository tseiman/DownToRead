name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    env:
      HAS_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build Windows/Linux artifacts
        if: matrix.os != 'macos-15-intel'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --publish never 2>&1 | tee electron-builder.log
      - name: Build unsigned macOS artifacts
        if: matrix.os == 'macos-15-intel' && env.HAS_MAC_CERTIFICATE != 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --mac --x64 --arm64 --publish never 2>&1 | tee electron-builder.log
      - name: Build signed macOS artifacts
        if: matrix.os == 'macos-15-intel' && env.HAS_MAC_CERTIFICATE == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          npx electron-builder --mac --x64 --arm64 --publish never 2>&1 | tee electron-builder.log
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
      - name: Report release builder failure
        if: failure()
        shell: bash
        run: |
          error_line=$(grep -E '⨯|Error:|ERR!' electron-builder.log 2>/dev/null | tail -n 1 || true)
          if [ -z "$error_line" ]; then
            error_line="A release step failed before electron-builder produced a diagnostic."
          fi
          echo "::error title=Release build failed on ${{ matrix.os }}::$error_line"
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/latest*.yml
            release-assets/*.blockmap
# The matrix produces latest-linux.yml, latest-mac.yml and latest.yml. A single
# dependent job publishes all platforms atomically into one release. Empty
# macOS signing secrets use an explicit unsigned path; populated secrets enable
# signing and notarization. The Intel runner emits both x64 and arm64 packages
# together so latest-mac.yml contains update entries for both architectures.
